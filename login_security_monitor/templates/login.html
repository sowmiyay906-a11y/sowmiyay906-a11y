{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h2>🔐 Secure Login</h2>
  <form method="POST">
    <input name="username" placeholder="Username" required autocomplete="off">
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Log In</button>
  </form>
  <p>New user? <a href="{{ url_for('register') }}">Create account</a></p>
  <p class="hint">⚠️ 5 wrong attempts → account locked 15 min</p>
</div>
{% endblock %}
